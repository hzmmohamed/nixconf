keys:
  - &primary age14uyqw28x64waqk3unet0wnpqvmwpsd880zts6wu0ay3gdtqr24as2het27
  - &fern age1adjvusv0p3j6848d3fgns9wc84x834jjng9sc7r4l2xrzkkwh4hsse9z95 # fern-age-key (scripts/fern/enroll.sh)
creation_rules:
  # fern (AWS agent host) decrypts with its own SSH host key, never the
  # primary key. Rules are first-match: keep these above the catch-all.
  # scripts/fern/enroll.sh turns each `# fern-recipient` line into `- *fern`
  # and runs `sops updatekeys` on the files fern's config references.
  - path_regex: secrets/fern/.*\.yaml$
    key_groups:
    - age:
      - *primary
      - *fern # fern-recipient
  - path_regex: secrets/shared/(tailscale|tailscale-oauth)\.yaml$
    key_groups:
    - age:
      - *primary
      - *fern # fern-recipient
  # Admin credentials for the operator's machine only (tailnet-as-code:
  # docs/plans/2026-11-17-tailnet-as-code.md). Primary key ONLY: never add a
  # host key or a fern-recipient marker here.
  - path_regex: secrets/admin/.*\.yaml$
    key_groups:
    - age:
      - *primary
  - path_regex: secrets/.*\.yaml$
    key_groups:
    - age:
      - *primary
